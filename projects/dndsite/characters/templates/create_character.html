{% extends "base.html" %}

{% block content %}
    <div class="container">
        <form method="post">
            {% csrf_token %}
            <h2>Create Character</h2>
            <div class="container">
            <div class="mb-5">
                <select class="form-select" aria-label="Default select example">
                    <option selected>Select template</option>
                    <option value="1">One</option>
                    <option value="2">Two</option>
                    <option value="3">Three</option>
                </select>
            </div>

            <div class="col-6">
                <div class="border pt-3">
                    <div class="row mb-3">
                        <div class="col input-group">
                            <input class="form-control" type="text" id="character_name" name="character_name" placeholder="Character name" required>
                        </div>
                        <div class="col input-group">
                            <input class="form-control" type="text" id="race" name="race" placeholder="Race">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col input-group">
                            <input class="form-control" type="text" id="class" name="class" placeholder="Class">
                        </div>
                        <div class="col input-group">
                            <input class="form-control" type="text" id="subclass" name="subclass" placeholder="Subclass">
                        </div>
                    </div>
                </div>

                <div class="border pt-3">
                    <div class="row mb-3">
                        <div class="col input-group">
                            <span class="input-group-text col-6" for="level">Level</span>
                            <input class="form-control numeric_input_no_arrows text-end" type="number" id="level" name="level" value="1">
                        </div>

                        <div class="col input-group">
                            <span class="input-group-text col-6" for="experience_points">Exp:</span>
                            <input class="form-control numeric_input_no_arrows text-end" type="number" id="experience_points" name="experience_points" value="0">
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-6">
                <div class="border pt-3">
                    <div class="row">
                        <div class="input-group mb-3 col">
                            <span class="input-group-text col-9" for="strength">Strength:</span>
                            <input type="number" id="strength" name="strength" value="10" class="form-control numeric_input_no_arrows text-end">
                        </div>

                        <div class="input-group mb-3 col">
                            <label class="input-group-text col-9" for="dexterity">Dexterity:</label>
                            <input type="number" id="dexterity" name="dexterity" value="10" class="form-control numeric_input_no_arrows text-end">
                        </div>
                    </div>

                    <div class="row">
                        <div class="input-group mb-3 col">
                            <span class="input-group-text col-9" for="constitution">Constitution:</span>
                            <input type="number" id="constitution" name="constitution" value="10" class="form-control numeric_input_no_arrows text-end">
                        </div>

                        <div class="input-group mb-3 col">
                            <label class="input-group-text col-9" for="intelligence">Intelligence:</label>
                            <input type="number" id="intelligence" name="intelligence" value="10" class="form-control numeric_input_no_arrows text-end">
                        </div>
                    </div>

                    <div class="row">
                        <div class="input-group mb-3 col">
                            <span class="input-group-text col-9" for="wisdom">Wisdom:</span>
                            <input type="number" id="wisdom" name="wisdom" value="10" class="form-control numeric_input_no_arrows text-end">
                        </div>

                        <div class="input-group mb-3 col">
                            <label class="input-group-text col-9" for="charisma">Charisma:</label>
                            <input type="number" id="charisma" name="charisma" value="10" class="form-control numeric_input_no_arrows text-end">
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <label for="aligment">Aligment</label>
                <input type="text" id="aligment" name="aligment"><br><br>
            </div>
            <div>
            <label for="size">Size</label>
                <input type="text" id="size" name="size"><br><br>

                <label for="age">Age:</label>
                <input type="number" id="age" name="age" value="0"><br><br>

                <label for="height">Height:</label>
                <input type="text" id="height" name="height"><br><br>

                <label for="weight">Weight:</label>
                <input type="text" id="weight" name="weight"><br><br>
            </div>
            <div>
                <label for="hit_points">Hit Points:</label>
                <input type="number" id="hit_points" name="hit_points" value="0"><br><br>

                <label for="armor_class">Armor Class:</label>
                <input type="number" id="armor_class" name="armor_class" value="10"><br><br>

                <label for ="movement_speed">Movement Speed:</label>
                <input type="number" id="movement_speed" name="movement_speed" value="30"><br><br>
            </div>
            <div>
                <label for="copper_coins">Copper Coins:</label>
                <input type="number" id="copper_coins" name="copper_coins" value="0"><br><br>

                <label for="silver_coins">Silver Coins:</label>
                <input type="number" id="silver_coins" name="silver_coins" value="0"><br><br>

                <label for="electrum_coins">Electrum Coins:</label>
                <input type="number" id="electrum_coins" name="electrum_coins" value="0"><br><br>

                <label for="gold_coins">Gold Coins:</label>
                <input type="number" id="gold_coins" name="gold_coins" value="0"><br><br>

                <label for="platinum_coins">Platinum Coins:</label>
                <input type="number" id="platinum_coins" name="platinum_coins" value="0"><br><br>
            </div>

            <button type="submit">Create Character</button>
        </form>
    </div>

    <div>
        <h3>Upload Character JSON</h3>
        <form method="post" action="{% url 'upload_json' %}" enctype="multipart/form-data">
            {% csrf_token %}
            {{ upload_json_files_form.as_p }}
            <button type="submit">Upload JSON</button>
        </form> 
    </div>
</div>
{% endblock %}
