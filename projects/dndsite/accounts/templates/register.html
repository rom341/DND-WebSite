{% extends "base.html" %}
{% load static %}

{% block content %}
    <div id="regiter-user-widget">
        <div>
            <h2>Register</h2>
        </div>
        <div id="register-user-widget-content">
            {% csrf_token %}
            <label for="first_name">First Name:</label>
            <input type="text" id="id_first_name" name="first_name" required><br><br>
            
            <label for="last_name">Last Name:</label>
            <input type="text" id="id_last_name" name="last_name"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="id_email" name="email"><br><br>

            <label for="username">Username:</label>
            <input type="text" id="id_username" name="username" required><br><br>
            
            <label for="password1">Password:</label>
            <input type="password" id="id_password1" name="password1" required><br><br>
            
            <label for="password2">Confirm Password:</label>
            <input type="password" id="id_password2" name="password2" required><br><br>
            
            <button id="register-user-widget-button">Register</button>
        </div>
        <script defer type="module" src="{% static 'accounts/js/widgets/register_user.js' %}"></script> 
    </div>
{% endblock %}
