<form id="add-user-to-lobby-form"
    hx-post="{% url 'add_user_to_lobby' %}"
    hx-target="#users-list"
    hx-swap="outerHTML">
    {% csrf_token %}
    {{ add_user_form.as_p }}
    <input type="hidden" name="lobby_id" value="{{ lobby_id }}">
    <button type="submit" class="btn btn-primary mt-2">Add User</button>
</form>
